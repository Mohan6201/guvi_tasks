events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Handle React Router. Everything under here (including the
        # /undefined/images/ workaround) is NOT content-hashed, so it
        # must never be cached without revalidation - otherwise a
        # browser that loaded a broken response once (e.g. before a
        # fix was deployed) keeps serving that stale response from its
        # own disk cache indefinitely, even after the server is fixed.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets - safe to cache aggressively since Vite
        # content-hashes these filenames (a changed file gets a new name).
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # The bundle's broken image src is a RELATIVE path
        # ("undefined/images/x.png", no leading slash), so the browser
        # resolves it against whatever route is currently open - "/" or
        # "/collection" resolve to "/undefined/images/x.png", but a
        # nested route like "/product/<id>" resolves one level deeper
        # to "/product/undefined/images/x.png" instead. Matching on
        # ".../undefined/images/<file>" regardless of what precedes it
        # (any route depth) and serving from the one real location
        # handles every route uniformly instead of only the shallow ones.
        location ~ ^.*/undefined/images/(.+)$ {
            add_header Cache-Control "no-cache";
            alias /usr/share/nginx/html/undefined/images/$1;
        }

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    }
}
