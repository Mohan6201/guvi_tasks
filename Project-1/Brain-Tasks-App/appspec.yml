# DEPRECATED - not used.
#
# AWS CodeDeploy does not support Amazon EKS as a deployment compute
# platform (only EC2/On-Premises, Lambda, and ECS), so appspec.yml +
# the CodeDeploy lifecycle hooks in scripts/ could never actually
# deploy this app to EKS.
#
# The pipeline's Deploy stage now runs buildspec-deploy.yml as a second
# CodeBuild project instead (see codebuild-setup.sh and
# codepipeline-setup.sh). scripts/*.sh are kept only as a reference for
# what each deploy step does; buildspec-deploy.yml is the real
# implementation.
